<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Set Table · concept board</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  /* neutral ramp */
  --page:#F4F5F7; --surface:#FFFFFF; --fill:#EDEFF2; --hairline:#E0E3E7; --border:#C9CED4;
  --muted:#646B73; --secondary:#4A5058; --ink:#14171A; --on-accent:#FFFFFF;
  /* the one accent */
  --accent:#185C3F; --accent-pressed:#124A33; --accent-tint:#E7F1EC; --danger:#B42318;
  /* data only */
  --push:#3A6F9A; --pull:#7A4F8E; --legs:#86651C; --core:#A9573A;
  --heat0:#E8EDF3; --heat1:#B9CADB; --heat2:#6F93B5; --heat3:#2F5F8A;
  /* elevation */
  --scrim:rgba(20,23,26,.4); --shadow:0 8px 24px rgba(20,23,26,.12);
  /* board only */
  --board:#E4E5E7; --marker:#E5007E;
  /* type */
  --font:'Inter',system-ui,sans-serif; --font-tight:'Inter Tight','Inter',sans-serif;
  --fs-tab:11px; --fs-cap:12px; --fs-meta:13px; --fs-sec:15px; --fs-body:17px; --fs-cell:20px;
  --fs-section:22px; --fs-title:28px; --fs-hero:60px; --fs-rest:64px;
  --fs-board:14px; --fs-board-thesis:20px; --fs-board-title:40px;
  /* radii */
  --r-cell:6px; --r-card:10px; --r-sheet:12px; --r-frame:40px; --r-pill:999px;
  /* geometry */
  --sb:47px; --safe:34px; --tab:49px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{margin:0;width:2760px;height:3240px;background:var(--board);font-family:var(--font);font-size:var(--fs-board);color:var(--ink);position:relative;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
svg{display:block}
.ic{flex:none}

/* ---------- board ---------- */
.bh{position:absolute;left:0;top:0;width:2760px;height:352px;padding:48px}
.bh h1{font:600 var(--fs-board-title)/48px var(--font-tight);letter-spacing:-.01em}
.bh .thesis{font-size:var(--fs-board-thesis);line-height:28px;margin-top:8px;color:var(--secondary)}
.bh .lines{margin-top:14px;font-size:var(--fs-board);line-height:22px;color:var(--secondary)}
.bh .lines b{color:var(--ink);font-weight:600}
.tokens{position:absolute;left:1240px;top:48px;display:flex;gap:14px;flex-wrap:wrap;width:1472px}
.tok{width:88px}
.tok i{display:block;width:40px;height:40px;border-radius:var(--r-cell);box-shadow:inset 0 0 0 1px rgba(20,23,26,.12)}
.tok b{display:block;font-size:var(--fs-cap);font-weight:600;margin-top:6px}
.tok span{display:block;font-size:var(--fs-cap);color:var(--secondary)}
.tokgap{width:20px}
.specimen{position:absolute;left:1240px;top:254px;font-size:var(--fs-board);color:var(--secondary);line-height:22px}
.specimen .tt{font:600 28px/32px var(--font-tight);color:var(--ink);font-variant-numeric:tabular-nums lining-nums}
.specimen .in{font-size:var(--fs-body);color:var(--ink)}
.flabel{position:absolute;font:600 var(--fs-board)/20px var(--font);color:var(--ink);white-space:nowrap}
.flabel span{font-weight:400;color:var(--secondary)}
.frame{position:absolute;width:390px;height:844px;border-radius:var(--r-frame);overflow:hidden;background:var(--page);box-shadow:0 1px 2px rgba(20,23,26,.08)}
.cap{position:absolute;width:390px;font-size:var(--fs-board);line-height:20px;color:var(--ink)}
.cap span{color:var(--secondary)}
.marker{position:absolute;width:44px;height:44px;border-radius:50%;border:2px dashed var(--marker);z-index:90;pointer-events:none}
.panel{position:absolute;left:1832px;top:2312px;width:836px;height:844px;background:var(--surface);border-radius:var(--r-sheet);padding:24px 28px;font-size:var(--fs-meta);line-height:17px;color:var(--ink);font-variant-numeric:tabular-nums lining-nums}
.panel h2{font:600 var(--fs-body)/24px var(--font);margin-bottom:8px}
.panel table{border-collapse:collapse;width:100%}
.panel td,.panel th{padding:3px 8px 3px 0;text-align:left;vertical-align:top;border-bottom:1px solid var(--hairline)}
.panel th{font-size:var(--fs-cap);color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.panel td.n{font-weight:600;white-space:nowrap}
.panel .ok{color:var(--accent);font-weight:600}
.panel .cl{display:grid;grid-template-columns:1fr 1fr;column-gap:28px}
.panel .cl div{padding:2px 0;border-bottom:1px solid var(--hairline)}
.panel .cl b{display:inline-block;width:22px}
.panel .note{color:var(--secondary);margin-top:10px}

/* ---------- screen primitives ---------- */
.scr{position:absolute;inset:0;overflow:hidden;background:var(--page);font-family:var(--font);color:var(--ink);font-size:var(--fs-body);line-height:1.3;font-variant-numeric:tabular-nums lining-nums}
.sb{position:absolute;top:0;left:0;right:0;height:var(--sb);z-index:60;display:flex;align-items:center;justify-content:space-between;padding:2px 24px 0 30px;color:var(--ink);pointer-events:none}
.sb .time{font-size:var(--fs-body);font-weight:600;width:56px;text-align:center}
.sb .glyphs{display:flex;gap:6px;align-items:center}
.home{position:absolute;left:128px;bottom:8px;width:134px;height:5px;border-radius:var(--r-pill);background:var(--ink);z-index:80;pointer-events:none}
.t11{font-size:var(--fs-tab)}.t12{font-size:var(--fs-cap)}.t13{font-size:var(--fs-meta)}.t15{font-size:var(--fs-sec)}.t17{font-size:var(--fs-body)}.t22{font-size:var(--fs-section)}.t28{font-size:var(--fs-title)}
.w4{font-weight:400}.w5{font-weight:500}.w6{font-weight:600}
.caps{text-transform:uppercase;letter-spacing:.05em;font-weight:600;font-size:var(--fs-cap)}
.muted{color:var(--muted)}.sec{color:var(--secondary)}.ink{color:var(--ink)}.acc{color:var(--accent)}.dng{color:var(--danger)}
.tight{font-family:var(--font-tight);font-weight:600;letter-spacing:-.01em}
.b56{width:56px;height:56px;display:flex;align-items:center;justify-content:center;color:var(--ink);flex:none}
.b44{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--ink);flex:none}
.primary{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:56px;border-radius:var(--r-card);background:var(--accent);color:var(--on-accent);font-size:var(--fs-body);font-weight:600}
.primary:active{background:var(--accent-pressed)}
.btn2{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:56px;border-radius:var(--r-card);border:1px solid var(--border);background:var(--surface);color:var(--ink);font-size:var(--fs-body);font-weight:500}
.prtag{display:inline-flex;align-items:center;height:18px;padding:0 5px;border:1.5px solid var(--accent);border-radius:4px;color:var(--accent);font-size:var(--fs-cap);font-weight:600;letter-spacing:.04em;line-height:1;text-transform:uppercase;flex:none}
.hl{height:1px;background:var(--hairline)}

/* tab pages */
.pg{position:absolute;top:var(--sb);left:0;right:0;bottom:calc(var(--tab) + var(--safe));overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.pg::-webkit-scrollbar,.wbody::-webkit-scrollbar{display:none}
.pg.full{bottom:0}
.tabs{position:absolute;left:0;right:0;bottom:0;height:calc(var(--tab) + var(--safe));background:var(--surface);border-top:1px solid var(--hairline);display:flex;padding-bottom:var(--safe);z-index:20}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:var(--fs-tab);font-weight:500}
.tabs button.on{color:var(--accent)}
.lt{display:flex;justify-content:space-between;align-items:flex-start;padding:8px 8px 0 16px}
.lt h1{font:600 var(--fs-title)/34px var(--font-tight);letter-spacing:-.01em;padding-top:4px}
.lt .acts{display:flex}
.under{padding:0 16px;font-size:var(--fs-meta);color:var(--muted);display:flex;align-items:center;gap:6px;height:20px}
.gh{padding:0 16px;height:36px;display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:8px;color:var(--muted)}
.section{background:var(--surface);border-top:1px solid var(--hairline);border-bottom:1px solid var(--hairline)}
.card{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-card)}

/* today */
.week{display:grid;grid-template-columns:repeat(7,1fr);padding:0 16px;margin-top:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px}
.day .dl{font-size:var(--fs-cap);font-weight:600;color:var(--muted)}
.day .dc{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:var(--fs-meta);font-weight:500;color:var(--secondary)}
.day .dc.done{background:var(--accent-tint);color:var(--accent)}
.day .dc.today{box-shadow:inset 0 0 0 2px var(--accent);color:var(--ink);font-weight:600}
.wcard{margin:0 16px;padding:16px}
.wcard .eye{color:var(--muted)}
.wcard h2{font:600 var(--fs-section)/28px var(--font-tight);margin-top:4px}
.xr{display:grid;grid-template-columns:1fr 84px 70px;align-items:center;height:44px;border-top:1px solid var(--hairline)}
.xr .v{text-align:right;color:var(--secondary)}
.more{height:32px;display:flex;align-items:center;border-top:1px solid var(--hairline);color:var(--muted);font-size:var(--fs-meta)}
.prog-note{display:flex;align-items:center;gap:8px;height:40px;border-top:1px solid var(--hairline);font-size:var(--fs-meta);font-weight:500}
.qrow{margin:16px 16px 0;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 16px;width:calc(100% - 32px)}

/* mini-bar */
.mini{position:absolute;left:0;right:0;bottom:calc(var(--tab) + var(--safe));height:64px;background:var(--surface);border-top:1px solid var(--hairline);display:flex;align-items:center;justify-content:space-between;padding:0 4px 0 16px;z-index:19;width:100%}
.mini .mt{font-size:var(--fs-body);font-weight:600}
.mini .mt span{font-weight:400;color:var(--secondary)}

/* workout sheet */
.behind{position:absolute;inset:0;background:var(--page)}
.wsheet{position:absolute;top:51px;left:0;right:0;bottom:0;background:var(--surface);border-radius:var(--r-sheet) var(--r-sheet) 0 0;box-shadow:var(--shadow);overflow:hidden;z-index:30}
.grab{position:absolute;left:177px;top:5px;width:36px;height:5px;border-radius:var(--r-pill);background:var(--border);z-index:5}
.wh{position:relative;height:56px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--hairline)}
.wh .wt{position:absolute;left:100px;right:100px;top:8px;text-align:center;line-height:20px}
.wh .wt .t13{line-height:18px}
.txtbtn{height:56px;padding:0 16px;display:flex;align-items:center;font-size:var(--fs-body);font-weight:600}
.wbody{position:absolute;top:56px;left:0;right:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.progl{display:flex;align-items:center;gap:12px;height:36px;padding:0 16px;border-bottom:1px solid var(--hairline)}
.pbar{flex:1;height:4px;border-radius:2px;background:var(--fill);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--secondary)}
.blk{padding:4px 16px 8px;border-bottom:1px solid var(--hairline)}
.bhd{display:flex;align-items:center;justify-content:space-between;height:56px;margin-right:-16px}
.bhd .nm{font-size:var(--fs-body);font-weight:600;line-height:22px}
.bhd .mt{font-size:var(--fs-meta);color:var(--muted);line-height:18px}
.bnote{font-size:var(--fs-meta);color:var(--muted);height:20px;display:flex;align-items:center;gap:6px}
.colh{display:grid;grid-template-columns:36px 72px 1fr 1fr 56px;column-gap:8px;height:28px;align-items:end;padding-bottom:6px;font-size:var(--fs-cap);font-weight:600;letter-spacing:.05em;color:var(--muted);text-transform:uppercase}
.colh > *{text-align:center}
.colh .pv{text-align:left}
.colh .ck{display:flex;justify-content:center}
.rw{display:grid;grid-template-columns:36px 72px 1fr 1fr 56px;column-gap:8px;align-items:center;height:56px;border-top:1px solid var(--hairline);position:relative}
.chip{width:28px;height:28px;border-radius:var(--r-cell);background:var(--fill);display:flex;align-items:center;justify-content:center;font-size:var(--fs-meta);font-weight:600;color:var(--secondary);margin-left:4px;position:relative}
.chip::after{content:"";position:absolute;inset:-14px -4px}
.prev{font-size:var(--fs-sec);color:var(--secondary);white-space:nowrap}
.prevpr{display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.prevpr .d{font-size:var(--fs-meta);font-weight:600;color:var(--accent);line-height:14px}
.cell{height:40px;border-radius:var(--r-cell);background:var(--fill);display:flex;align-items:center;justify-content:center;font-size:var(--fs-cell);font-weight:500;color:var(--secondary);width:100%}
.dv{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:var(--fs-cell);font-weight:500;color:var(--secondary);height:56px;line-height:22px}
.dv small{font-size:var(--fs-cap);color:var(--muted);line-height:14px;font-weight:500}
.okb{width:56px;height:56px;display:flex;align-items:center;justify-content:center}
.okb i{width:32px;height:32px;border-radius:var(--r-cell);display:flex;align-items:center;justify-content:center}
.okb.done i{background:var(--accent-tint);color:var(--accent)}
.okb.todo i{box-shadow:inset 0 0 0 1.5px var(--border)}
.flash{background:var(--accent-tint);box-shadow:-16px 0 0 var(--accent-tint),16px 0 0 var(--accent-tint)}
.rstrip{display:flex;align-items:center;gap:10px;height:22px;margin-top:-2px}
.rstrip .tr{flex:1;height:4px;border-radius:2px;background:var(--fill);overflow:hidden}
.rstrip .tr i{display:block;height:100%;background:var(--accent);border-radius:2px}
.rstrip .tm{font-size:var(--fs-meta);color:var(--secondary);font-weight:500;width:34px;text-align:right}
.ra{height:136px;padding:12px 0 16px;border-top:1px solid var(--hairline);position:relative}
.ra1{display:flex;align-items:center;gap:8px;height:28px}
.ra1 .chip{margin-left:0}
.ra1 .t13{color:var(--secondary)}
.ra2{display:grid;grid-template-columns:1fr 112px 64px;column-gap:8px;margin-top:16px;height:64px}
.hc{height:64px;border-radius:var(--r-cell);background:var(--fill);display:flex;align-items:baseline;justify-content:center;gap:4px;padding-top:2px;overflow:hidden}
.hc .hn{font:600 var(--fs-hero)/62px var(--font-tight);letter-spacing:-.02em;color:var(--ink)}
.hc .u{font-size:var(--fs-meta);color:var(--muted);font-weight:500}
.hc.focus{box-shadow:inset 0 0 0 2px var(--accent);background:var(--surface)}
.okbig{width:64px;height:64px;border-radius:var(--r-card);background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center}
.cx{display:flex;align-items:center;width:100%;height:64px;padding-left:16px;border-bottom:1px solid var(--hairline);gap:12px}
.cx .st{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.cx .st.done{background:var(--accent-tint);color:var(--accent)}
.cx .st.up{box-shadow:inset 0 0 0 1.5px var(--border)}
.cx .tx{flex:1;min-width:0}
.cx .nm{font-size:var(--fs-body);font-weight:600;line-height:22px}
.cx .mt{font-size:var(--fs-meta);color:var(--muted);line-height:18px;display:flex;align-items:center;gap:6px}
.discard{padding:24px 16px 32px;display:flex;justify-content:center}
.discard button{height:56px;padding:0 16px;font-size:var(--fs-body);font-weight:500;color:var(--danger)}
.dock{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--hairline);padding:8px 16px 42px;z-index:6}
.overl{display:flex;justify-content:space-between;align-items:center;height:24px;margin-bottom:6px;font-size:var(--fs-meta)}
.rdock{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--hairline);padding:0 16px var(--safe);z-index:6}
.eff{padding:12px 0;border-bottom:1px solid var(--hairline)}
.eff .lab{display:flex;justify-content:space-between;font-size:var(--fs-meta);line-height:16px;color:var(--secondary);margin-bottom:8px}
.chips4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chips4 button{height:56px;border-radius:var(--r-cell);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:var(--fs-body);font-weight:500}
.chips4 button.on{box-shadow:inset 0 0 0 1px var(--accent);border-color:var(--accent);color:var(--accent);font-weight:600}
.trow{height:112px;display:flex;align-items:center;justify-content:space-between}
.cd{display:flex;flex-direction:column;align-items:flex-start}
.cd .big{font:600 var(--fs-rest)/64px var(--font-tight);letter-spacing:-.02em;color:var(--ink)}
.cd .of{font-size:var(--fs-meta);color:var(--muted);line-height:18px;margin-top:2px}
.tbtns{display:flex;gap:8px}
.tbtns button{width:56px;height:56px;border-radius:var(--r-card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:var(--fs-body);font-weight:500}
.toast{position:absolute;left:16px;right:16px;top:115px;height:52px;background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-card);box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;padding:0 16px;z-index:40;font-size:var(--fs-body);font-weight:500;white-space:nowrap}
.snack{position:absolute;left:16px;right:16px;height:52px;background:var(--ink);color:var(--on-accent);border-radius:var(--r-card);display:flex;align-items:center;justify-content:space-between;padding:0 4px 0 16px;z-index:70;font-size:var(--fs-body)}
.snack button{height:52px;padding:0 16px;font-weight:600;color:var(--on-accent)}

/* sheets */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:50}
.bs{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:var(--r-sheet) var(--r-sheet) 0 0;box-shadow:var(--shadow);padding:0 16px var(--safe);z-index:55}
.bsh{display:flex;align-items:center;justify-content:space-between;height:64px;padding-top:8px;margin-right:-12px}
.bsh .nm{font-size:var(--fs-body);font-weight:600;line-height:22px}
.bsec{padding:12px 0 16px;border-top:1px solid var(--hairline)}
.bsec .hd{display:flex;align-items:center;gap:8px;height:24px;margin-bottom:6px}
.bsec .hd .r{margin-left:auto}
.wu{display:grid;grid-template-columns:1fr 110px 70px;align-items:center;height:32px}
.wu .r{text-align:right}
.wuh{display:grid;grid-template-columns:1fr 110px 70px;height:20px;align-items:center}
.wuh .r{text-align:right}
.lrow{display:flex;align-items:center;gap:12px;height:56px;width:100%;border-top:1px solid var(--hairline)}
.lrow .v{margin-left:auto;color:var(--secondary)}
.lrow .chev{color:var(--muted)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 0 8px;border-top:1px solid var(--hairline)}
.trio button{height:64px;border-radius:var(--r-card);border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:var(--fs-meta);font-weight:500}
.optrow{display:flex;align-items:center;justify-content:space-between;height:56px;width:100%;border-top:1px solid var(--hairline);font-size:var(--fs-body)}
.optrow .k{display:inline-flex;width:28px;height:28px;border-radius:var(--r-cell);background:var(--fill);align-items:center;justify-content:center;font-size:var(--fs-meta);font-weight:600;color:var(--secondary);margin-right:12px}
.optrow.on{color:var(--accent);font-weight:600}
.kpad{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:var(--r-sheet) var(--r-sheet) 0 0;box-shadow:var(--shadow);padding:12px 16px var(--safe);z-index:7}
.kpad .kh{font-size:var(--fs-meta);color:var(--secondary);height:24px;display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:64px;gap:8px}
.keys button{border-radius:var(--r-card);background:var(--fill);display:flex;align-items:center;justify-content:center;font-size:var(--fs-cell);font-weight:500;gap:6px}
.keys button.fn{background:var(--surface);box-shadow:inset 0 0 0 1px var(--border);font-size:var(--fs-body)}
.keys button.lg{background:var(--accent);color:var(--on-accent);font-size:var(--fs-body);font-weight:600}

/* lists, charts */
.srow{display:flex;flex-direction:column;justify-content:center;height:64px;padding:0 16px;border-top:1px solid var(--hairline);width:100%}
.srow:first-child{border-top:0}
.srow .l1,.srow .l2{display:flex;justify-content:space-between;align-items:center}
.srow .l1{font-size:var(--fs-meta);color:var(--muted);line-height:18px}
.srow .l2{font-size:var(--fs-body);font-weight:600;line-height:24px}
.srow .l2 .s{font-size:var(--fs-meta);font-weight:400;color:var(--secondary)}
.chipsH{display:flex;gap:8px;padding:0 16px;overflow:hidden;white-space:nowrap}
.chipsH button{height:36px;padding:0 12px;border-radius:var(--r-cell);border:1px solid var(--border);font-size:var(--fs-sec);font-weight:500;flex:none;background:var(--surface)}
.chipsH button.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);color:var(--accent);font-weight:600}
.rec{display:flex;justify-content:space-between;align-items:center;height:44px;padding:0 16px;border-top:1px solid var(--hairline);font-size:var(--fs-sec)}
.rec:first-child{border-top:0}
.rec .v{font-weight:600}
.rec .v span{font-weight:400;color:var(--muted);font-size:var(--fs-meta);margin-left:8px}
.fam{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;column-gap:8px;height:24px;font-size:var(--fs-meta)}
.fam .bar{height:6px;border-radius:3px;background:var(--fill);position:relative}
.fam .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.fam .n{text-align:right;color:var(--secondary)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.gap{display:flex;align-items:center;gap:6px;font-size:var(--fs-meta);color:var(--secondary);height:20px}
.leg{display:flex;gap:10px;align-items:center;font-size:var(--fs-cap);color:var(--secondary)}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;box-shadow:inset 0 0 0 1px rgba(20,23,26,.08)}

/* library */
.seg{display:grid;grid-template-columns:1fr 1fr;margin:8px 16px 0;height:36px;background:var(--fill);border-radius:var(--r-cell);padding:2px}
.seg button{border-radius:5px;font-size:var(--fs-meta);font-weight:600;color:var(--secondary);display:flex;align-items:center;justify-content:center}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--hairline)}
.ptr{display:grid;grid-template-columns:8px 1fr 68px 28px 46px;column-gap:6px;align-items:center;height:30px;padding:0 16px;font-size:var(--fs-sec);border-top:1px solid var(--hairline)}
.ptr:first-child{border-top:0}
.ptr .v{text-align:right;color:var(--secondary);font-size:var(--fs-meta);white-space:nowrap}
.ptr .nm{white-space:nowrap;overflow:hidden}
.fam4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:10px 16px 12px}
.fam4 .t{display:flex;justify-content:space-between;font-size:var(--fs-meta);margin-bottom:6px}
.fam4 .bar{height:6px;border-radius:3px;background:var(--fill);position:relative}
.fam4 .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.pe{border-top:1px solid var(--hairline)}
.per{display:grid;grid-template-columns:24px 8px 1fr 68px 28px 46px;column-gap:6px;align-items:center;height:44px;padding:0 16px 0 8px;font-size:var(--fs-sec)}
.per .v{text-align:right;color:var(--secondary);font-size:var(--fs-meta);white-space:nowrap}
.per .g{color:var(--muted);display:flex;justify-content:center}
.pe.open{background:var(--surface)}
.stg{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:4px 16px 0}
.stp{height:56px;border-radius:var(--r-cell);box-shadow:inset 0 0 0 1px var(--border);display:grid;grid-template-columns:48px 1fr 48px;align-items:center}
.stp button{height:56px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.stp .c{text-align:center;line-height:16px}
.stp .c .l{font-size:var(--fs-cap);color:var(--muted);display:block;font-weight:500}
.stp .c .v{font-size:var(--fs-body);font-weight:600;display:block;line-height:22px}
.tgl{height:56px;border-radius:var(--r-cell);box-shadow:inset 0 0 0 1px var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 10px 0 12px;font-size:var(--fs-meta);font-weight:500;width:100%}
.sw{width:44px;height:26px;border-radius:var(--r-pill);background:var(--border);position:relative;flex:none}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(20,23,26,.2)}
.sw.on{background:var(--accent)}
.sw.on::after{left:21px}
.rm{display:flex;justify-content:space-between;align-items:center;padding:4px 16px 4px}
.rm button{height:44px;font-size:var(--fs-sec);font-weight:500}
.addr{display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;color:var(--accent);font-size:var(--fs-sec);font-weight:600;border-top:1px solid var(--hairline);width:100%}
.topbar{display:flex;align-items:center;justify-content:space-between;height:56px;position:relative}
.topbar .c{position:absolute;left:90px;right:90px;text-align:center;font-weight:600}
.search{margin:8px 16px 0;height:40px;border-radius:var(--r-cell);background:var(--fill);display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--muted);font-size:var(--fs-sec)}
.anim-up{animation:up .22s ease-out}
.anim-down{animation:down .2s ease-out}
.anim-fade{animation:fade .18s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes down{from{transform:translateY(-16px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.anim-up,.anim-down,.anim-fade{animation:none}}
</style>

function volChart(w=358, h=160){

    s += `<text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="12" fill="var(--muted)">${t}</text>`; });
  VOL.forEach(([d,wk,v],i) => { const x = L + slot*i + (slot-bw)/2;

  s += `<text x="${L+slot/2}" y="${h-4}" text-anchor="start" dx="-6" font-size="12" fill="var(--muted)">21 Sep</text>`;

}
function e1rmChart(lift='Back squat', w=358, h=150){
  const L=50, T=22, B=22, R=26, ch=h-T-B, cw=w-L-R;
  let pts, ymin, ymax, ticks, xt, last;
  if (lift === 'Back squat') { pts = [[0,66.7],[4,68.0],[9,70.0],[14,72.0],[18,74.2],[22,75.0]]; ymin=64; ymax=77; ticks=[65,70,75];
    xt = [[0,'21 Sep'],[9,'30 Sep'],[18,'9 Oct'],[22,'13 Oct']]; last='75.0 kg'; }
  else { const m = {'DB bench press':[14.8,15.0],'Deadlift':[78.0,81.3],'Machine row':[66.0,68.8]}[lift];
    pts = [[0,m[0]],[22,m[1]]]; const pad = (m[1]-m[0]) || 1; ymin = m[0]-pad; ymax = m[1]+pad; ticks = [m[0], m[1]];
    xt = [[0,'21 Sep'],[22,'13 Oct']]; last = m[1].toFixed(1)+' kg'; }
  const x = d => L + d/22*cw, y = v => T + ch - (v-ymin)/(ymax-ymin)*ch;
  let s = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="font-family:var(--font);font-variant-numeric:tabular-nums">`;
  ticks.forEach(t => { s += `<line x1="${L}" x2="${w-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--hairline)"/><text x="${L-8}" y="${y(t)+4}" text-anchor="end" font-size="12" fill="var(--muted)">${nf(t)}</text>`; });
  s += `<line x1="${L}" x2="${w-R}" y1="${T+ch}" y2="${T+ch}" stroke="var(--border)"/>`;
  xt.forEach(([d,t],i) => { s += `<text x="${x(d)}" y="${h-4}" text-anchor="${i===xt.length-1?'end':(i===0?'start':'middle')}" font-size="12" fill="var(--muted)" ${i===xt.length-1?'dx="6"':''}>${t}</text>`; });
  s += `<polyline points="${pts.map(p=>x(p[0])+','+y(p[1])).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach((p,i) => { const lst = i === pts.length-1;
    s += `<circle cx="${x(p[0])}" cy="${y(p[1])}" r="${lst?4.5:3}" fill="${lst?'var(--accent)':'var(--surface)'}" stroke="var(--accent)" stroke-width="2"/>`; });

  s += `<text x="${x(lp[0])+4}" y="${y(lp[1])-10}" text-anchor="end" font-size="12" font-weight="600" fill="var(--ink)">${last}</text>`;
  return s + '</svg>';
}

  board.insertAdjacentHTML('beforeend', `<div class="marker" style="left:${b.left + b.width/2 - 22}px;top:${b.top + b.height/2 - 22}px"></div>`); }
[['Tap 1 · Log set 3','One tap on the dock bar (or the row’s ✓) logs 62.5 × 8.'],
 ['Rest starts automatically · PR shown, nothing blocks','Strip under row 3, rest dock at 2:59, toast for 3 s, row flash 1.2 s.'],
 ['At 0:00 → set 4 pre-filled · 0 taps','Chime; the dock reverts to Log set 4 · 62.5 × 8.']].forEach(([a,b],c) =>
  board.insertAdjacentHTML('beforeend', `<div class="cap" style="left:${XS[c]}px;top:${YS[2]+844+12}px"><b>${a}</b><br><span>${b}</span></div>`));

/* row-3 panel: tap counts + self-check */
const CHECK = [
 ['Neutral field ≥ 85%','Grey page, white surfaces; colour only in ✓, dock bar, tags, charts.'],
 ['One accent','#185C3F: primary bar, active ✓, focus ring, active tab, rest strip, PR tag.'],
 ['Data colours in data','Family colours only in 8 px dots and chart bars; heat ramp only in the body map.'],
 ['≤ 6 sizes, ≤ 3 weights','S4: 12·13·17·20·60·64; weights 400·500·600.'],
 ['Tabular figures','font-variant-numeric on every screen root; columns align.'],
 ['Radii','Cells/chips/keys-in-cells 6; cards, buttons 10; sheet tops 12; pills only on toggles.'],
 ['Zero decoration','No gradients, art, trophies; PR is a tag + delta.'],
 ['One left edge','16 px margin; numbers right-aligned in program and history columns.'],
 ['One elevation','Hairlines; one shadow, sheets and toasts only.'],
 ['One icon family','Lucide paths, 24 grid, 1.75 stroke, round caps.'],
 ['Copy','Sentence case, verb-led, units shown, no “!”.'],
 ['Hero ≥ 60 px','Active row 60 px; rest countdown 64 px.'],
 ['Contrast','Numerals in ink 16.5:1 or secondary 7.46:1; meta muted ≥ 4.68:1.'],
 ['Targets','Rows 56, ✓ 56 / 64, rest buttons 56, RIR chips 56, keys 64, gaps 8.'],
 ['Primary bar','Log bar 56 px, bottom edge 42 px above the frame bottom.'],
 ['Rare actions away','Finish top right; Discard last row of the sheet; delete in the set sheet.'],
 ['Default set view','Exercise, set n/N, target, previous, inputs, ✓; tools behind ⋯.'],
 ['Dark theme','n/a: light concept.'],
 ['Tabs hidden in workout','Sheet covers tabs; 64 px mini-bar to return.'],
 ['One primary per screen','Dock bar and active ✓ are the same action.'],
 ['1-tap log + auto rest','✓ or dock bar → strip + rest dock.'],
 ['Start ≤ 2 taps','1 tap: Start Workout A.'],
 ['Undo','Set deleted · Undo; Swapped to Front squat · Undo; Remove exercise · Undo.'],
 ['Sheets vs full screen','Tools, set type, rest, keypad = sheets; swap, info, history = full screen; never stacked.'],
 ['States','Empty + offline (S8), PR without modal (S5a), over-time +0:12, finish-early sheet.']];
board.insertAdjacentHTML('beforeend', `<div class="panel">
  <h2>Tap counts</h2>
  <table><tr><th>Task</th><th>Taps</th><th>Sequence</th></tr>
  ${[['Start today’s workout','1','Today → Start Workout A. Back squat row 3 is active.'],['Log a set as planned','1','Active ✓, or the dock bar.'],['Change weight one step, then log','3','KG cell → +2.5 → Log ✓.'],['Type a weight, then log','4','KG cell → 6 → 5 → Log ✓.'],['Finish, all sets done','1','Finish → summary.'],['Finish early','2','Finish → 14 sets not logged → Finish workout.']].map(r => `<tr><td>${r[0]}</td><td class="n">${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</table>
  <h2 style="margin-top:14px">Self-check · 25 items · all pass</h2>
  <div class="cl">${CHECK.map((c,k) => `<div><b>${k+1}</b><span class="ok">Pass</span> · <span class="w6">${c[0]}</span> — <span style="color:var(--secondary)">${c[1]}</span></div>`).join('')}</div>
  <div class="note">Rest frames swap the log bar for the 112 px rest dock (the brief’s design); the active row’s 64 px ✓ stays the one primary target.</div></div>`);

/* ======================================================================
   Live prototype (frame P)
   ====================================================================== */
const S = {view:'today', sub:null, sheet:null, lift:'Back squat', libSeg:'program', libEdit:false, P:clone(PROG), Pdraft:null, open:['A',0], wo:null, snack:null};
const pScr = fP.querySelector('.scr');
let toastT, flashT, snackT;

function startWorkout(){ const w = stateM1(); w.startAt = Date.now() - 850*1000; w.open = true; w.anim = true; S.wo = w; S.wantScroll = true; }
function setSnack(text, undo){ S.snack = {text, undo}; clearTimeout(snackT); snackT = setTimeout(() => { S.snack = null; render(); }, 5000); }
function setToast(html){ const w = S.wo; w.toast = html; clearTimeout(toastT); toastT = setTimeout(() => { if (S.wo) { S.wo.toast = null; render(); } }, 3000); }
function chime(){ try { const a = new (window.AudioContext||window.webkitAudioContext)(), o = a.createOscillator(), g = a.createGain();
  o.frequency.value = 880; g.gain.setValueAtTime(.08, a.currentTime); g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + .6);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + .6); } catch(e){} }

function render(){
  const key = (S.wo && S.wo.open) ? 'w' + (S.wo.page||'') : S.view + (S.sub||'') + S.libEdit, prev = pScr.querySelector('.wbody, .pg'), st = prev && key === S.lastKey ? prev.scrollTop : 0; S.lastKey = key;
  let h;
  if (S.wo && S.wo.open) h = screen({kind:'workout', w:S.wo, live:true});
  else {
    h = SB;
    if (S.sub === 'settings') h += settingsPage() + tabs(S.view);
    else if (S.sub === 'hist') h += histDetail() + tabs('history');
    else if (S.view === 'today') h += todayPage({inProgress: !!S.wo}) + tabs('today');
    else if (S.view === 'history') h += historyPage() + tabs('history');
    else if (S.view === 'progress') h += progressPage(S.lift) + tabs('progress');
    else h += libraryPage({seg:S.libSeg, edit:S.libEdit, open:S.open, P:S.libEdit ? S.Pdraft : S.P}) + (S.libEdit ? '' : tabs('library'));
    if (S.wo) h += miniBar(S.wo, true);
    if (S.sheet === 'wb') h += `<div class="scrim anim-fade" data-a="close"></div>` + wbSheet();
    h += HOME;
  }
  if (S.snack) { const bottom = S.wo && S.wo.open ? 120 : (S.wo ? 156 : 92);
    h += `<div class="snack anim-up" style="bottom:${bottom}px"><span>${S.snack.text}</span>${S.snack.undo?'<button data-a="undo">Undo</button>':''}</div>`; }
  pScr.innerHTML = h;
  if (S.wo) S.wo.anim = false;
  const now = pScr.querySelector('.wbody, .pg');
  if (now) { if (S.wantScroll && S.wo && S.wo.open) autoScroll(fP, 'block'); else now.scrollTop = st; }
  S.wantScroll = false;
}

function logRow(i, j){
  const w = S.wo, ex = w.exs[i], r = ex.rows[j];
  if (r.done) return;
  r.done = true; w.kp = null;
  const k = r.kind === 'W' ? 'W' : setNo(ex, j);
  w.rest = {i, j, k, total: ex.rest, endAt: Date.now() + ex.rest*1000, over:false, rir:null};
  if (r.prOn && parseFloat(r.kg) >= r.prOn) {
    r.pr = {delta: deltaTxt(r)};
    setToast(`<span class="acc w6">New PR</span><span>· Heaviest set · ${r.kg} kg × ${r.reps}</span>`);
    w.flash = {i, j}; clearTimeout(flashT); flashT = setTimeout(() => { if (S.wo) { S.wo.flash = null; render(); } }, 1200);
  }
  if (exDone(ex) && i === w.cur) {
    const nx = w.exs.findIndex(e => !exDone(e));
    const n = ex.rows.filter(x => x.kind !== 'W').length;
    setToast(nx >= 0 ? `<span>All ${n} sets logged · Up next: ${w.exs[nx].name}</span>` : `<span>All sets logged · Finish when ready</span>`);
    if (nx >= 0) w.cur = nx;
  }
  S.wantScroll = true;
}
function keyPress(v){
  const w = S.wo, kp = w.kp, ex = w.exs[kp.i], r = ex.rows[kp.j], kg = kp.f === 'kg', step = kg ? ex.step : 1;
  let val = r[kp.f];
  if (/^[0-9]$/.test(v)) { val = kp.fresh ? v : (val.length < 5 ? val + v : val); kp.fresh = false; }
  else if (v === '.') { if (kp.fresh) val = '0.'; else if (!val.includes('.')) val += '.'; kp.fresh = false; }
  else if (v === 'bs') { val = val.slice(0,-1) || '0'; kp.fresh = false; }
  else if (v === 'inc' || v === 'dec') { const n = parseFloat(val); if (!isNaN(n)) val = nf(Math.max(0, n + (v === 'inc' ? step : -step))); kp.fresh = true; }
  else if (v === 'next') { if (kg) { kp.f = 'reps'; kp.fresh = true; } else w.kp = null; return; }
  else if (v === 'log') { if (r.done) w.kp = null; else logRow(kp.i, kp.j); return; }
  else return;
  r[kp.f] = val;
}

pScr.addEventListener('click', e => {
  const t = e.target.closest('[data-a]'); if (!t) return;
  const a = t.dataset.a, d = t.dataset, w = S.wo;
  switch (a) {
    case 'tab': S.view = d.v; S.sub = null; S.libEdit = false; break;
    case 'start': startWorkout(); break;
    case 'min': w.open = false; w.sheet = null; w.kp = null; break;
    case 'restore': if (w) { w.open = true; w.anim = true; S.wantScroll = true; } break;
    case 'log': logRow(d.i !== undefined ? +d.i : w.cur, d.j !== undefined ? +d.j : activeIdx(w.exs[w.cur])); break;
    case 'goto': w.cur = w.exs.findIndex(x => !exDone(x)); S.wantScroll = true; break;
    case 'expand': w.cur = +d.i; w.kp = null; S.wantScroll = true; break;
    case 'kp': w.kp = {i:+d.i, j:+d.j, f:d.f, fresh:true}; w.sheet = null; S.wantScroll = true; break;
    case 'key': keyPress(d.v); if (w.kp) S.wantScroll = false; break;
    case 'kind': w.sheet = {type:'kind', i:+d.i, j:+d.j}; w.kp = null; break;
    case 'kindSet': w.exs[w.sheet.i].rows[w.sheet.j].kind = d.v; w.sheet = null; break;
    case 'delSet': { const {i,j} = w.sheet, snap = clone(w.exs[i].rows); w.exs[i].rows.splice(j,1); w.sheet = null;
      setSnack('Set deleted', () => { S.wo.exs[i].rows = snap; }); break; }
    case 'tools': w.sheet = {type:'tools'}; w.kp = null; break;
    case 'restsheet': w.sheet = {type:'rest'}; w.kp = null; break;
    case 'restSet': { const s = +d.v; if (w.rest && !w.rest.over) { const el = w.rest.total - (w.rest.endAt - Date.now())/1000; w.rest.total = s; w.rest.endAt = Date.now() + (s - el)*1000; }
      else w.exs[w.cur].rest = s; w.sheet = null; break; }
    case 'restOffer': { const ex = w.exs[w.rest ? w.rest.i : w.cur]; ex.rest = 160; w.sheet = null; setToast('<span>Saved to A/B Split</span>'); break; }
    case 'r-15': w.rest.endAt = Math.max(Date.now(), w.rest.endAt - 15000); break;
    case 'r+15': w.rest.endAt += 15000; break;
    case 'skip': w.rest = null; break;
    case 'rir': { w.rest.rir = d.v; const r = w.exs[w.rest.i].rows[w.rest.j]; r.rir = d.v; break; }
    case 'finish': w.kp = null; if (doneWorking(w) >= 23) { w.page = 'summary'; w.rest = null; } else w.sheet = {type:'finish'}; break;
    case 'finishConfirm': w.sheet = null; w.page = 'summary'; w.rest = null; w.toast = null; break;
    case 'done': S.wo = null; S.view = 'today'; break;
    case 'discard': { const snap = S.wo; S.wo = null; setSnack('Workout discarded', () => { S.wo = snap; snap.open = true; }); break; }
    case 'page': w.sheet = null; w.page = d.v; break;
    case 'subback': if (w && w.open && w.page) w.page = null; else S.sub = null; break;
    case 'swapPick': { const ex = w.exs[w.cur], old = ex.name; ex.name = 'Front squat'; w.page = null;
      setSnack('Swapped to Front squat', () => { ex.name = old; }); break; }
    case 'close': if (w && w.open) w.sheet = null; else S.sheet = null; break;
    case 'undo': if (S.snack && S.snack.undo) S.snack.undo(); S.snack = null; clearTimeout(snackT); break;
    case 'settings': S.sub = 'settings'; break;
    case 'histRow': S.sub = 'hist'; break;
    case 'wbPreview': S.sheet = 'wb'; break;
    case 'lift': S.lift = d.v; break;
    case 'seg': S.libSeg = d.v; break;
    case 'pEdit': S.libEdit = true; S.Pdraft = clone(S.P); S.open = ['A',0]; break;
    case 'pCancel': S.libEdit = false; break;
    case 'pSave': S.libEdit = false; S.P = S.Pdraft; break;
    case 'pOpen': S.open = (S.open && S.open[0] === d.w && S.open[1] === +d.k) ? null : [d.w, +d.k]; break;
    case 'pStep': { const r = S.Pdraft[S.open[0]][S.open[1]], f = +d.f, dir = +d.d;
      if (f === 4) r[4] = Math.max(15, r[4] + 15*dir);
      else if (f === 5) r[5] = Math.max(0, Math.round((r[5] + r[7]*dir)*100)/100);
      else r[f] = Math.max(1, r[f] + dir);
      if (r[2] > r[3]) { if (f === 2) r[3] = r[2]; else r[2] = r[3]; } break; }
    case 'pAmrap': { const r = S.Pdraft[S.open[0]][S.open[1]]; r[8] = !r[8]; break; }
    case 'pRemove': { const snap = clone(S.Pdraft), name = S.Pdraft[d.w][+d.k][0]; S.Pdraft[d.w].splice(+d.k,1); S.open = null;
      setSnack(`${name} removed`, () => { S.Pdraft = snap; }); break; }
    default: return;
  }
  render();
});

/* real-seconds ticking: Date.now() + 250 ms interval, only text nodes update */
setInterval(() => {
  const w = S.wo; if (!w) return;
  const now = Date.now();
  pScr.querySelectorAll('[data-t="elapsed"]').forEach(n => n.textContent = mmss((now - w.startAt)/1000));
  if (w.rest) {
    const left = Math.ceil((w.rest.endAt - now)/1000);
    if (!w.rest.over && left <= 0) { w.rest.over = true; chime(); S.wantScroll = false; render(); return; }
    if (!w.rest.over) {
      pScr.querySelectorAll('[data-t="rest"]').forEach(n => n.textContent = mmss(left));
      pScr.querySelectorAll('[data-t="restbar"]').forEach(n => n.style.width = Math.max(0, Math.min(1, (w.rest.endAt - now)/1000 / w.rest.total))*100 + '%');
    } else pScr.querySelectorAll('[data-t="over"]').forEach(n => n.textContent = '+' + mmss((now - w.rest.endAt)/1000));
  }
}, 250);

render();
</script>

<script>
function C(sel){const el=document.querySelector('#f-P '+sel); if(!el){document.title='MISSING '+sel; console.log('MISSING',sel); return;} el.click();}
const seqs = {
 A: [['[data-a=start]']],
 B: [['[data-a=start]'],['.dock .primary']],
 C: [['[data-a=start]'],['.dock .primary'],['[data-a="r-15"]'],['[data-a="r-15"]']],
 D: [['[data-a=start]'],['.dock .primary'],['[data-a=skip]']],
 E: [['[data-a=start]'],['.dock .primary'],['FAST']],
 F: [['[data-a=start]'],['.dock .primary'],['[data-a=skip]'],['.okbig']],
 G: [['[data-a=start]'],['.dock .primary'],['[data-a=skip]'],['.okbig'],['[data-a=finish]']],
 H: [['[data-a=start]'],['.dock .primary'],['[data-a=skip]'],['.okbig'],['[data-a=finish]'],['[data-a=finishConfirm]']],
 I: [['[data-a=start]'],['.dock .primary'],['[data-a=skip]'],['.okbig'],['[data-a=finish]'],['[data-a=finishConfirm]'],['[data-a=done]']],
 J: [['[data-a=start]'],['.dock .primary'],['[data-a=min]']],
 K: [['[data-a=start]'],['.hc[data-f=kg]']],
 L: [['[data-a=start]'],['.hc[data-f=kg]'],['[data-v=inc]']],
 M: [['[data-a=start]'],['[data-a=tools]']],
 N: [['[data-a=start]'],['.dock .primary'],['.cd']],
};
const SEQ = seqs['M']; let k=0;
function step(){ if(k>=SEQ.length) return; const s=SEQ[k++][0];
  if(s==='FAST'){ S.wo.rest.endAt = Date.now()+300; setTimeout(step, 1600); return; }
  C(s); setTimeout(step, 400); }
setTimeout(step, 300);
</script>
