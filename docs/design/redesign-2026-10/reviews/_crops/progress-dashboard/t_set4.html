<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Progress Dashboard · redesign concept 4</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* neutral ramp */
  --page:#F6F6F8; --surface:#FFFFFF; --fill:#EEEEF2; --hair:#E3E3E9; --ctrl:#CACAD3;
  --muted:#62626F; --sec:#45454F; --ink:#16161D;
  /* accent */
  --accent:#4338A8; --accent-pressed:#362C8C; --accent-tint:#EEEDF8; --on-accent:#FFFFFF;
  --danger:#B42318;
  /* data */
  --push:#256F91; --pull:#96506F; --legs:#4F7A33; --core:#93611A;
  --h0:#E6F1F2; --h1:#A9D3D6; --h2:#4E9DA4; --h3:#1D6970;
  --bar-a:#45454F; --bar-b:#8A8A97;
  /* effects */
  --scrim:rgba(22,22,29,.4); --shadow:0 8px 24px rgba(22,22,29,.12);
  /* board */
  --board:#E4E5E7; --marker:#E5007E;
  /* type scale */
  --t12:12px; --t14:14px; --t16:16px; --t20:20px; --t28:28px; --t60:60px; --t64:64px;
  /* radii */
  --r6:6px; --r10:10px; --r12:12px; --r-frame:40px; --r-pill:999px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{margin:0;width:2760px;height:3240px;background:var(--board);font-family:'Geist',system-ui,sans-serif;font-size:14px;color:var(--ink);position:relative;overflow:hidden;font-variant-numeric:tabular-nums lining-nums;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;font-variant-numeric:tabular-nums lining-nums}
svg{display:block}
b{font-weight:600}

/* ---------- board ---------- */
.bh{position:absolute;left:0;top:0;width:2760px;height:352px;padding:48px}
.bh h1{font-size:40px;font-weight:600;letter-spacing:-.02em;line-height:48px}
.bh .thesis{font-size:20px;line-height:28px;color:var(--sec);margin-top:8px;max-width:1300px}
.bh .lines{margin-top:16px;font-size:14px;line-height:22px;color:var(--sec);max-width:1500px}
.bh .lines b{color:var(--ink)}
.tokens{position:absolute;left:1640px;top:48px;width:1072px}
.tokrow{display:flex;gap:10px;margin-bottom:14px;align-items:flex-start}
.tok{width:72px;font-size:12px;line-height:15px;color:var(--sec)}
.tok i{display:block;width:40px;height:40px;border-radius:var(--r6);border:1px solid rgba(22,22,29,.12);margin-bottom:4px}
.tokcap{font-size:12px;font-weight:600;color:var(--ink);width:88px;padding-top:12px}
.spec{font-size:14px;color:var(--sec);margin-top:6px}
.spec span{font-size:28px;font-weight:600;color:var(--ink);margin-right:16px}
.flabel{position:absolute;font-size:14px;font-weight:600;line-height:20px;color:var(--ink);white-space:nowrap}
.flabel span{font-weight:400;color:var(--sec)}
.frame{position:absolute;width:390px;height:844px;border-radius:var(--r-frame);overflow:hidden;background:var(--surface);box-shadow:0 1px 0 rgba(22,22,29,.06)}
.cap{position:absolute;width:390px;font-size:14px;line-height:20px;color:var(--sec);text-align:center}
.cap b{color:var(--ink)}
.tapmark{position:absolute;width:44px;height:44px;border-radius:50%;border:2px dashed var(--marker);z-index:60;pointer-events:none}
.panel{position:absolute;left:1832px;top:2312px;width:836px;height:844px;background:var(--surface);border-radius:var(--r12);padding:28px 32px;font-size:13px;line-height:18px;color:var(--sec);display:flex;gap:28px}
.panel h3{font-size:16px;font-weight:600;color:var(--ink);margin-bottom:10px}
.panel table{border-collapse:collapse;width:100%}
.panel td,.panel th{padding:4px 8px 4px 0;border-bottom:1px solid var(--hair);vertical-align:top;text-align:left}
.panel th{font-weight:600;color:var(--ink)}
.panel .ok{color:var(--accent);font-weight:600}

/* ---------- phone chrome ---------- */
.sb{position:absolute;top:0;left:0;right:0;height:47px;display:flex;align-items:center;justify-content:space-between;padding:4px 24px 0 38px;z-index:40;color:var(--ink);pointer-events:none}
.sb-t{font-size:16px;font-weight:600;letter-spacing:-.01em}
.sb-g{display:flex;gap:6px;align-items:center}
.hi{position:absolute;bottom:8px;left:128px;width:134px;height:5px;border-radius:3px;background:var(--ink);z-index:80;pointer-events:none}
.scr{position:absolute;inset:0;background:var(--page);overflow:hidden}
.scr.white{background:var(--surface)}
.sc{position:absolute;left:0;right:0;bottom:0;overflow:hidden;padding:0 16px}
.P .sc{overflow-y:auto;scrollbar-width:none}
.P .sc::-webkit-scrollbar{display:none}

/* ---------- type ---------- */
.t12{font-size:var(--t12);line-height:16px}
.t14{font-size:var(--t14);line-height:20px}
.t16{font-size:var(--t16);line-height:22px}
.t20{font-size:var(--t20);line-height:26px;letter-spacing:-.01em}
.t28{font-size:var(--t28);line-height:34px;letter-spacing:-.02em}
.w4{font-weight:400}.w5{font-weight:500}.w6{font-weight:600}
.muted{color:var(--muted)}.sec{color:var(--sec)}.ink{color:var(--ink)}.acc{color:var(--accent)}.dng{color:var(--danger)}
.cap12{font-size:var(--t12);line-height:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center}
.sp{flex:1}
.r{text-align:right}

/* ---------- components ---------- */
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border:1.5px solid var(--accent);color:var(--accent);border-radius:var(--r-pill);font-size:var(--t12);font-weight:600;letter-spacing:.04em;line-height:1;white-space:nowrap;background:var(--surface)}
.tag.sm{height:16px;padding:0 4px;font-size:10px;border-width:1px}
.card{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r12);padding:12px}
.ib{width:56px;height:56px;display:grid;place-items:center;color:var(--ink);flex:none}
.ib.sm{width:44px;height:44px}
.bpri{display:flex;align-items:center;justify-content:center;gap:8px;height:56px;border-radius:var(--r10);background:var(--accent);color:var(--on-accent);font-size:var(--t16);font-weight:600;width:100%}
.bpri.h64{height:64px}
.bout{display:flex;align-items:center;justify-content:center;gap:8px;height:56px;border:1px solid var(--ctrl);border-radius:var(--r10);background:var(--surface);font-size:var(--t16);font-weight:600;color:var(--ink)}
.seg{display:flex;background:var(--fill);border-radius:var(--r6);padding:3px;gap:3px}
.seg button{flex:1;border-radius:4px;font-size:var(--t14);font-weight:500;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--hair)}
.chip{height:36px;padding:0 12px;border:1px solid var(--hair);border-radius:var(--r6);font-size:var(--t14);font-weight:500;color:var(--sec);background:var(--surface);white-space:nowrap;display:inline-flex;align-items:center}
.chip.on{border:1.5px solid var(--accent);color:var(--accent);font-weight:600}
.hl{height:1px;background:var(--hair)}

/* tabs */
.tabs{position:absolute;left:0;right:0;bottom:0;height:83px;background:var(--surface);border-top:1px solid var(--hair);display:flex;padding:0 8px 34px;z-index:20}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:var(--t12);font-weight:500;height:49px}
.tab.on{color:var(--accent);font-weight:600}

/* live strip (minimised workout) */
.strip{position:absolute;top:47px;left:0;right:0;height:48px;background:var(--surface);border-bottom:1px solid var(--hair);display:flex;align-items:center;padding:0 4px 0 16px;gap:10px;z-index:25;cursor:pointer}
.dot8{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.strip .ret{height:48px;padding:0 12px;color:var(--accent);font-weight:600;font-size:var(--t16)}

/* nav title */
.nav{display:flex;align-items:flex-end;justify-content:space-between;padding-top:8px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.kpi{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r12);padding:10px 12px}
.kpi .v{font-size:var(--t28);line-height:34px;font-weight:600;letter-spacing:-.02em}

/* heat matrix */
.mx{display:grid;grid-template-columns:1fr 1fr;column-gap:16px;row-gap:4px}
.mxr .of{white-space:nowrap}
.mxr{display:flex;align-items:center;height:20px;gap:6px}
.mxr .lb{width:76px;font-size:var(--t14);color:var(--sec);white-space:nowrap}
.hc{width:32px;height:20px;border-radius:4px;display:grid;place-items:center;font-size:var(--t12);font-weight:600}
.legend{display:flex;align-items:center;gap:12px;font-size:var(--t12);color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
.legend .sq0{box-shadow:inset 0 0 0 1px var(--hair)}

/* lifts list */
.lrow{display:flex;align-items:center;height:40px;gap:12px}
.lrow+.lrow{border-top:1px solid var(--hair)}

/* today dock */
.tdock{position:absolute;left:0;right:0;bottom:83px;height:128px;background:var(--surface);border-top:1px solid var(--hair);padding:12px 16px;z-index:15}

/* ---------- live session ---------- */
.lh{position:absolute;top:47px;left:0;right:0;height:96px;border-bottom:1px solid var(--hair);background:var(--surface);z-index:10}
.lh1{display:flex;align-items:center;height:56px;padding-right:8px}
.lh1 .tt{flex:1;display:flex;align-items:baseline;gap:10px}
.fin{height:56px;padding:0 8px;display:grid;place-items:center}
.fin span{display:inline-flex;align-items:center;height:36px;padding:0 14px;border:1px solid var(--ctrl);border-radius:var(--r10);font-weight:600;font-size:var(--t14)}
.lh2{padding:0 16px;display:flex;flex-direction:column;gap:4px}
.lh3{display:flex;align-items:center;justify-content:space-between;height:16px}
.lseg{position:absolute;top:151px;left:16px;right:16px;height:48px}
.lc{position:absolute;top:199px;left:0;right:0;bottom:0;overflow:hidden;padding:8px 16px 260px}
.P .lc{overflow-y:auto;scrollbar-width:none}
.P .lc::-webkit-scrollbar{display:none}
.curh{display:flex;align-items:center;height:56px;margin-right:-16px}
.curh>div{flex:1}
.grid{display:flex;gap:8px;margin-top:4px}
.cell{position:relative;width:70px;height:64px;border-radius:var(--r6);border:1px solid var(--hair);background:var(--surface);display:flex;flex-direction:column;justify-content:space-between;padding:6px 8px 8px;text-align:left}
.cell.w{width:46px}
.cell .ix{display:flex;justify-content:space-between;align-items:center;font-size:var(--t12);line-height:14px;color:var(--muted);font-weight:500}
.cell .vv{font-size:var(--t16);font-weight:600;line-height:20px;white-space:nowrap}
.cell.done{background:var(--fill);border-color:var(--fill)}
.cell.cur{border:2px solid var(--accent);padding:5px 7px 7px}
.cell.fut .vv{color:var(--muted);font-weight:500}
.cell .tag.sm{position:absolute;top:5px;right:5px}
.eff{display:flex;align-items:center;gap:8px;margin-top:8px}
.eff .el{width:52px;font-size:var(--t12);line-height:16px;color:var(--muted)}
.eff button{flex:1;height:56px;border:1px solid var(--ctrl);border-radius:var(--r6);font-size:var(--t16);font-weight:500;background:var(--surface)}
.eff button.on{border:2px solid var(--accent);color:var(--accent);font-weight:600}
.last{margin-top:8px;height:20px}
.stp{display:flex;align-items:center;height:64px;margin-top:8px}
.stp button.pm{width:56px;height:56px;border:1px solid var(--ctrl);border-radius:var(--r10);display:grid;place-items:center;background:var(--surface)}
.stp .num{flex:1;display:flex;align-items:baseline;justify-content:center;gap:8px;height:64px;cursor:pointer}
.stp .num b{font-size:var(--t60);line-height:64px;font-weight:600;letter-spacing:-.03em}
.stp .num.kp b{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:6px}
.proj{display:flex;align-items:center;gap:8px;height:24px;margin-top:8px}
.oth{margin-top:16px;border-top:1px solid var(--hair)}
.orow{display:flex;align-items:center;height:56px;border-bottom:1px solid var(--hair);gap:12px}
.orow .nm{flex:1;min-width:0}
.dots{display:flex;gap:4px;justify-content:flex-end}
.dots i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--ctrl)}
.dots i.d{background:var(--sec);border-color:var(--sec)}
/* docks */
.ldock{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--hair);padding:12px 16px 46px;z-index:12}
.over{height:24px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.rdock{position:absolute;left:0;right:0;bottom:0;height:242px;background:var(--surface);border-top:1px solid var(--hair);z-index:12}
.offer{display:flex;align-items:center;gap:8px;height:56px;width:100%;padding:0 16px;color:var(--sec);font-size:var(--t14);font-weight:500;border-bottom:1px solid var(--hair);text-align:left}
.rpa{display:flex;align-items:center;height:64px;margin:12px 16px 0;gap:12px}
.timer{font-size:var(--t64);line-height:64px;font-weight:600;letter-spacing:-.03em;width:142px;flex:none}
.rpb{display:flex;gap:8px;margin:8px 16px 0}
.rpb .bout{width:72px;flex:none}
.rpb .bpri{flex:1}
/* toast */
.toast{position:absolute;top:53px;left:12px;right:12px;height:68px;background:var(--surface);border:1px solid var(--hair);border-radius:var(--r12);box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;padding:0 14px;z-index:50}
.toast .tx{flex:1}
@media (prefers-reduced-motion:no-preference){
  .P .toast{animation:drop .22s ease-out}
  .P .sheet{animation:up .22s ease-out}
}
@keyframes drop{from{transform:translateY(-16px);opacity:0}to{transform:none;opacity:1}}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
/* all view */
.ablk{padding:10px 0 12px;border-bottom:1px solid var(--hair)}
.ablk .hd{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.agrid{display:flex;gap:8px}
.acell{position:relative;width:56px;height:56px;border-radius:var(--r6);border:1px solid var(--hair);background:var(--surface);display:flex;flex-direction:column;justify-content:center;align-items:center;line-height:16px}
.acell .a1{font-size:var(--t14);font-weight:600;line-height:18px}
.acell .a2{font-size:var(--t12);color:var(--muted)}
.acell.done{background:var(--fill);border-color:var(--fill)}
.acell.cur{border:2px solid var(--accent)}
.acell.fut .a1{color:var(--muted);font-weight:500}
.acell.w{width:44px}
.acell .tag.sm{position:absolute;top:-6px;right:-4px}
/* sheets */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:60}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:var(--r12) var(--r12) 0 0;box-shadow:var(--shadow);z-index:70;padding:0 16px 34px}
.grab{width:36px;height:5px;border-radius:3px;background:var(--ctrl);margin:8px auto 0}
.srow{display:flex;align-items:center;height:56px;border-bottom:1px solid var(--hair);gap:12px;font-size:var(--t16);width:100%;text-align:left}
.srow .v{color:var(--muted);font-size:var(--t14)}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.keys button{height:64px;border-radius:var(--r10);background:var(--fill);font-size:var(--t20);font-weight:500}
.keys button.k2{font-size:var(--t16);font-weight:600}
.keys button.go{background:var(--accent);color:var(--on-accent);font-size:var(--t16);font-weight:600}
.snack{position:absolute;left:16px;right:16px;bottom:120px;height:48px;border-radius:var(--r10);background:var(--ink);color:var(--surface);display:flex;align-items:center;padding:0 4px 0 16px;font-size:var(--t14);z-index:55}

/* tables */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:var(--t12);font-weight:500;color:var(--muted);text-align:left;height:24px;border-bottom:1px solid var(--hair);white-space:nowrap}
.tbl td{font-size:var(--t14);height:32px;border-bottom:1px solid var(--hair);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.fdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:1px}
.pgrid td{height:36px}
.tbl td.r,.tbl th.r{padding-left:12px}
/* edit */
.erow{display:flex;align-items:center;min-height:52px;border-bottom:1px solid var(--hair);gap:6px}
.erow .h{width:20px;color:var(--muted);flex:none}
.erow .n{flex:1;font-size:var(--t14);line-height:17px;min-width:0}
.ec{height:36px;border-radius:var(--r6);background:var(--fill);display:grid;place-items:center;font-size:var(--t14);font-weight:500;flex:none}
.ec.f{background:var(--surface);border:2px solid var(--accent);font-weight:600}
.ehd{display:flex;gap:6px;font-size:var(--t12);color:var(--muted);height:24px;align-items:center;border-bottom:1px solid var(--hair)}
.w36{width:36px}.w52{width:52px}.w44{width:44px}.w48{width:48px}.w24{width:24px}
</style>
</head>

<div id="board"></div>

 return `<svg width="${W}" height="12">${g}</svg><div class="legend" style="margin-top:8px;gap:14px">${fams.map(f=>`<span><i style="background:var(--${f});border-radius:50%"></i>${FAM[f][0]} <b class="ink">${FAM[f][1]}</b></span>`).join('')}</div>`}

    else{const cur=i===st.ex&&j===l.length;cells.push(`<button class="acell ${cur?'cur':'fut'}" data-a="qlog" data-e="${i}" data-k="${j}"><span class="a1">${fw(cur?st.cur[0]:pl[0])}</span><span class="a2">×${cur?st.cur[1]:pl[1]}</span></button>`)}}
   h+=`<div class="ablk"><div class="hd"><span class="t16 w6">${e.n}</span><span class="t12 muted">${l.length}/${e.s} · ${e.s} × ${e.rr}</span></div><div class="agrid">${cells.join('')}</div></div>`});
 }else{
  const ci=allDone?ex.s-1:k;const pl=allDone?null:st.cur;
  h+=`<div class="curh"><div><div class="t20 w6">${ex.n}</div><div class="t14 muted">${allDone?`All ${ex.s} sets logged`:`Set ${k+1} of ${ex.s} · target ${ex.rr}`}</div></div><button class="ib" data-a="tools" aria-label="Exercise tools">${ic('more')}</button></div>
  <div class="grid">${ex.warm?`<div class="cell w done"><div class="ix">W${ic('check',12,'stroke-width="2.5"')}</div><div class="vv">3</div></div>`:''}`;

   if(d)h+=`<div class="cell done"><div class="ix">${j+1}${d[3]?'':ic('check',12,'stroke-width="2.5"')}</div><div class="vv">${cellVal(d[0],d[1])}</div>${d[3]?'<span class="tag sm">PR</span>':''}</div>`;

  if(!allDone){const lt=ex.last[k];

   const ee=e1(st.cur[0],st.cur[1]);

    h+=`<div class="proj t14 sec">e1RM <b class="ink">${ee.toFixed(1)}</b> · record ${st.rec.e1.toFixed(1)} ${pr?`→ <span class="tag">PR if logged</span>`:`<span class="muted">· no PR at this load</span>`}</div>`}
   else if(ee)h+=`<div class="proj t14 sec">e1RM <b class="ink">${ee.toFixed(1)}</b></div>`;}
  h+=`<div class="oth">${EX.map((e,i)=>{if(i===st.ex)return'';const l=st.logs[i];const vt=l.reduce((a,s)=>a+(s[0]==='BW'?0:s[0]*s[1]),0),vl=e.last.reduce((a,s)=>a+(s[0]==='BW'?0:s[0]*s[1]),0);

 if(st.toast)h+=`<div class="toast"><span class="tag">PR</span><div class="tx"><div class="t16 w6">New PR · Heaviest set</div><div class="t14 sec">62.5 kg × 8 · +2.5 kg</div></div>${spark([52.5,55,57.5,57.5,60,62.5],48,20,{end:'var(--accent)',label:'Heaviest set history'})}</div>`;
 if(st.kp)h+=keypadHTML(st);
 if(st.sheet==='tools')h+=toolsHTML(st);
 if(st.sheet==='finish')h+=finishHTML(st);
 return h+'</div>'}
function restBar(st){const W=196,tot=Math.max(st.rest.total,180),left=restLeft(st),el=Math.max(0,st.rest.total-left),X=v=>v/tot*W,mk=X(160);

function keypadHTML(st){const f=st.kp.f,ex=EX[st.ex],step=f==='w'?ex.step:1;
 const hd=f==='w'?`Weight · kg · step ${ex.step}${st.ex===0?` · Per side: ${plates(+st.kp.buf||st.cur[0])}`:''}`:`Reps · target ${ex.rr}`;

function barSVG(){const W=358,cy=58;let g=`<rect x="8" y="${cy-3}" width="${W-16}" height="6" rx="3" fill="var(--ctrl)"/><rect x="${W/2-60}" y="${cy-4}" width="120" height="8" rx="2" fill="var(--bar-b)"/>`;

/* ================= prototype P ================= */
const P={scr:'dash',lv:null,min:false};
const pEl=document.getElementById('P');
function pRender(){const sc=pEl.querySelector('[data-scroll]');const top=sc?sc.scrollTop:0;const same=pEl.dataset.k===pKey();
 let h='';const strip=P.lv&&P.min?P.lv:null;
 if(P.scr==='live')h=liveHTML(P.lv);else if(P.scr==='summary')h=summaryHTML();
 else h={dash:dashHTML,sessions:sessionsHTML,lifts:liftsHTML,program:programHTML}[P.scr]({strip});
 pEl.innerHTML=h+statusBar();pEl.dataset.k=pKey();
 const n=pEl.querySelector('[data-scroll]');if(n&&same)n.scrollTop=top}
function pKey(){return P.scr+(P.lv?P.lv.view+P.lv.ex:'')}
function startRest(lv,secs){lv.rest={end:Date.now()+secs*1000,total:secs};lv.over=null}
function logSet(lv,ei,w,r){const ex=EX[ei],lg=lv.logs[ei];const k=lg.length;let pr=false;
 if(ei===0){const ee=e1(w,r);if(ee>lv.rec.e1||w>lv.rec.heavy){pr=true;lv.rec={e1:Math.max(ee,lv.rec.e1),heavy:Math.max(w,lv.rec.heavy)}}}
 lg.push([w,r,null,pr?1:0]);if(pr){lv.prs++;lv.toast=true;clearTimeout(lv.tt);lv.tt=setTimeout(()=>{lv.toast=false;if(P.scr==='live')pRender()},3000)}
 lv.ex=ei;lv.rirFor=k+1;lv.rir=null;lv.offer=false;lv.kp=null;
 if(lg.length>=ex.s){const nx=EX.findIndex((e,i)=>i>ei&&lv.logs[i].length<e.s);lv.allMsg=`All ${ex.s} sets logged · Up next: ${nx>=0?EX[nx].n:'Finish'}`;}
 else{lv.allMsg=null;const p=(ex.plan||[])[k+1]||[ex.kg,ex.last[k+1][1]];lv.cur=[p[0],p[1]]}
 startRest(lv,ex.rest)}
function endRest(lv,natural){lv.rest=null;lv.rirFor=null;lv.over=natural?0:null;lv.overT0=Date.now();
 const ex=EX[lv.ex];if(lv.logs[lv.ex].length>=ex.s){const nx=EX.findIndex((e,i)=>lv.logs[i].length<e.s);if(nx>=0){lv.ex=nx;const k=lv.logs[nx].length;const e=EX[nx];const p=(e.plan||[])[k]||[e.kg,e.last[k][1]];lv.cur=[p[0],p[1]]}lv.allMsg=null}}
function applyKey(lv,k){const ex=EX[lv.ex],kp=lv.kp,f=kp.f,idx=f==='w'?0:1,step=f==='w'?ex.step:1;
 if(/^\d$/.test(k)||k==='.'){if(f==='r'&&k==='.')return;kp.buf=kp.fresh?(k==='.'?'0.':k):kp.buf+k;kp.fresh=false;const v=parseFloat(kp.buf);if(!isNaN(v))lv.cur[idx]=v}
 else if(k==='⌫'){kp.buf=String(lv.cur[idx]).slice(0,-1);kp.fresh=false;lv.cur[idx]=parseFloat(kp.buf)||0}
 else if(k.startsWith('−')||k.startsWith('+')){if(lv.cur[idx]==='BW')return;lv.cur[idx]=Math.max(0,Math.round((lv.cur[idx]+(k[0]==='+'?step:-step))*100)/100);kp.fresh=true}
 else if(k==='Next'){lv.kp={f:f==='w'?'r':'w',buf:'',fresh:true}}
 else if(k==='Log ✓'){logSet(lv,lv.ex,lv.cur[0],lv.cur[1])}}
pEl.addEventListener('click',ev=>{const t=ev.target.closest('[data-a]');if(!t||!pEl.contains(t))return;const a=t.dataset.a,v=t.dataset.v,lv=P.lv;
 switch(a){
  case 'tab':P.scr=v;break;
  case 'start':P.lv=M1();P.lv.el=null;P.lv.t0=Date.now()-850*1000;P.min=false;P.scr='live';break;
  case 'min':P.min=true;P.scr='dash';lv.sheet=null;lv.kp=null;break;
  case 'ret':P.min=false;P.scr='live';break;
  case 'view':lv.view=v;lv.kp=null;break;
  case 'w+':case 'w-':if(lv.cur[0]!=='BW'){const st=EX[lv.ex].step;lv.cur[0]=Math.max(0,Math.round((lv.cur[0]+(a==='w+'?st:-st))*100)/100)}break;
  case 'r+':lv.cur[1]++;break;
  case 'r-':lv.cur[1]=Math.max(1,lv.cur[1]-1);break;
  case 'log':if(lv.logs[lv.ex].length<EX[lv.ex].s)logSet(lv,lv.ex,lv.cur[0],lv.cur[1]);break;
  case 'qlog':{const ei=+t.dataset.e,e=EX[ei],k=lv.logs[ei].length;const p=ei===lv.ex?lv.cur:((e.plan||[])[k]||[e.kg,e.last[k][1]]);logSet(lv,ei,p[0],p[1]);break}
  case 'kp':lv.kp={f:v,buf:'',fresh:true};lv.sheet=null;break;
  case 'kpclose':lv.kp=null;break;
  case 'key':applyKey(lv,v);break;
  case 'm15':lv.rest.end-=15000;lv.rest.total=Math.max(15,lv.rest.total-15);break;
  case 'p15':lv.rest.end+=15000;lv.rest.total+=15;break;
  case 'skip':endRest(lv,false);break;
  case 'rir':lv.rir=+v;break;
  case 'offer':if(!lv.allMsg)lv.offer=true;break;
  case 'tools':lv.sheet='tools';lv.tseg=lv.tseg||'plates';lv.kp=null;break;
  case 'tseg':lv.tseg=v;break;
  case 'close':lv.sheet=null;break;
  case 'finish':lv.sheet='finish';lv.kp=null;break;
  case 'dofinish':case 'done':if(a==='done'){P.lv=null;P.scr='dash';P.min=false}else{P.scr='summary'}break;
  default:return;}
 pRender()});
setInterval(()=>{const lv=P.lv;if(!lv)return;
 pEl.querySelectorAll('[data-tick="el"],[data-tick="sel"]').forEach(n=>n.textContent=mmss(elapsed(lv)));
 if(lv.rest){const left=restLeft(lv);if(left<=0){endRest(lv,true);pRender();return}
  pEl.querySelectorAll('[data-tick="rest"],[data-tick="srest"]').forEach(n=>n.textContent=mmss(left));
  const bar=pEl.querySelector('[data-tick="bar"]');if(bar){const tot=Math.max(lv.rest.total,180);bar.setAttribute('width',(Math.max(0,lv.rest.total-left)/tot*196).toFixed(1))}}
 else if(lv.over!=null){lv.over=(Date.now()-lv.overT0)/1000;const n=pEl.querySelector('[data-tick="over"]');if(n)n.textContent='+'+mmss(lv.over)}
},250);
pRender();
</script>
