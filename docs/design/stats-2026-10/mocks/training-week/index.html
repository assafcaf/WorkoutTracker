<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Training Week · stats concept 3</title>
<style>
:root{
  /* board */
  --board:#0B0C0E; --board-text:#E6E8EB; --board-muted:#9AA1AA; --anno:#E5007E;
  /* surfaces and ink */
  --bg:#121417; --s1:#1A1D21; --s2:#23272C; --line:#2E3338;
  --muted:#9AA1AA; --sec:#B4BAC2; --text:#E6E8EB;
  /* one accent */
  --accent:#7DB7E8; --on-accent:#0E1A26;
  /* data */
  --done:#3F95D6; --under:#BC7F25; --context:#5B636D;
  --band1:#3E5B78; --band2:#4F80AE; --band3:#6DA6DA; --band4:#A3CEF3;
  /* type */
  --font:Bahnschrift,"Segoe UI",system-ui,sans-serif;
  --fs-xs:12px; --fs-s:13px; --fs-m:15px; --fs-l:20px; --fs-xl:28px; --fs-hero:72px;
  --fs-board:14px; --fs-board-m:20px; --fs-board-l:40px; --fs-panel:13px;
  --w-reg:400; --w-semi:600;
  /* shape */
  --r-card:8px; --r-chip:4px; --r-phone:40px; --pad:20px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{width:2760px;height:3240px;background:var(--board);color:var(--board-text);font-family:var(--font);font-size:var(--fs-board);position:relative;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
.num{font-variant-numeric:tabular-nums}

/* board */
.hdr{position:absolute;left:48px;top:40px;width:2664px}
.hdr h1{font-size:var(--fs-board-l);font-weight:var(--w-semi);letter-spacing:-.01em}
.hdr .thesis{font-size:var(--fs-board-m);color:var(--board-text);margin-top:8px}
.hdr .four{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-top:20px;color:var(--board-muted);line-height:20px}
.hdr .four b{color:var(--board-text);font-weight:var(--w-semi);display:block}
.tokens{display:flex;gap:14px;margin-top:22px;align-items:flex-start}
.tok{width:92px;color:var(--board-muted);font-size:var(--fs-xs);line-height:16px}
.tok i{display:block;width:40px;height:40px;border-radius:var(--r-chip);margin-bottom:6px;box-shadow:inset 0 0 0 1px var(--line)}
.tok b{display:block;color:var(--board-text);font-weight:var(--w-reg)}
.tokgap{width:18px}
.specimen{margin-left:24px;padding-left:24px;border-left:1px solid var(--line);color:var(--board-muted);font-size:var(--fs-xs);line-height:18px}
.specimen .s1{font-size:var(--fs-xl);color:var(--board-text);font-weight:var(--w-semi);line-height:34px}
.flabel{position:absolute;font-size:var(--fs-board);font-weight:var(--w-semi);height:20px;white-space:nowrap;color:var(--board-text)}
.flabel span{color:var(--board-muted);font-weight:var(--w-reg)}
.fcap{position:absolute;width:390px;color:var(--board-muted);line-height:18px}
.fcap b{color:var(--board-text);font-weight:var(--w-semi)}
.tapm{position:absolute;width:44px;height:44px;border:2px dashed var(--anno);border-radius:50%;pointer-events:none;z-index:5}
.arrow{position:absolute;pointer-events:none;z-index:5}
.dctl{position:absolute;left:48px;top:1252px;width:390px;color:var(--board-muted)}
.dctl .row{display:flex;gap:8px;margin-top:6px}
.dctl button{flex:1;height:30px;border:2px dashed var(--anno);border-radius:var(--r-chip);color:var(--board-text);text-align:center;font-size:var(--fs-s)}
.dctl button.on{background:var(--anno);border-style:solid;color:var(--board)}
.panel{position:absolute;left:1832px;top:2312px;width:836px;height:844px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-card);padding:24px 28px;font-size:var(--fs-panel);line-height:17px;color:var(--sec);overflow:hidden}
.panel h3{font-size:var(--fs-m);color:var(--text);font-weight:var(--w-semi);margin-bottom:8px}
.panel table{border-collapse:collapse;width:100%}
.panel td,.panel th{padding:3px 6px 3px 0;vertical-align:top;text-align:left}
.panel th{color:var(--muted);font-weight:var(--w-reg)}
.panel .ck td{padding:1px 6px 1px 0}
.panel .ck td:first-child{color:var(--muted);width:22px}
.panel .ck td:nth-child(2){width:62px;color:var(--text)}
.panel .pt{color:var(--under)}

/* phone */
.phone{position:absolute;width:390px;height:844px;border-radius:var(--r-phone);overflow:hidden;background:var(--bg);color:var(--text);font-size:var(--fs-m);line-height:1.3}
.sb{height:47px;display:flex;align-items:center;justify-content:space-between;padding:0 30px 0 34px;font-size:var(--fs-m);font-weight:var(--w-semi)}
.scr{position:absolute;left:0;right:0;top:47px;bottom:90px;overflow:hidden}
.phone.notabs .scr{bottom:34px}
.phone.live .scr{overflow-y:auto;scrollbar-width:none}
.phone.live .scr::-webkit-scrollbar{display:none}
.tabs{position:absolute;left:0;right:0;bottom:34px;height:56px;background:var(--s1);border-top:1px solid var(--line);display:flex}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:var(--fs-xs);color:var(--muted)}
.tabs button.on{color:var(--accent)}
.home{position:absolute;left:0;right:0;bottom:0;height:34px;background:var(--s1)}
.phone.notabs .home{background:var(--bg)}
.home i{position:absolute;left:128px;bottom:8px;width:134px;height:5px;border-radius:3px;background:var(--text)}
.pg{padding:0 var(--pad) 24px}

/* shared parts */
.trow{display:flex;align-items:center;justify-content:space-between;height:48px}
.t1{font-size:var(--fs-xl);font-weight:var(--w-semi);letter-spacing:-.01em}
.chips{display:flex;gap:8px}
.chip{height:44px;display:flex;align-items:center}
.chip span{display:block;height:32px;line-height:30px;padding:0 12px;border:1px solid var(--line);border-radius:var(--r-chip);font-size:var(--fs-s);color:var(--sec);background:var(--s1)}
.chip.on span{background:var(--s2);border-color:var(--accent);color:var(--accent);font-weight:var(--w-semi)}
.nw{white-space:nowrap}
.att{display:flex;gap:8px;margin:2px 0 6px}
.att button{flex:1;text-align:center;height:44px;padding:0 4px;border:1px solid var(--line);border-radius:var(--r-chip);background:var(--s1);font-size:var(--fs-s);color:var(--text);white-space:nowrap}
.att button b{font-weight:var(--w-semi)}
.prog{font-size:var(--fs-l);line-height:26px;margin-top:4px}
.prog span{font-size:var(--fs-s);color:var(--muted)}
.mrow{display:block;width:100%;height:56px;padding-top:6px}
.mrow .l{display:flex;justify-content:space-between;align-items:baseline;height:26px}
.mrow .v{font-size:var(--fs-l);font-variant-numeric:tabular-nums}
.mrow .v span{color:var(--muted);font-size:var(--fs-s)}
.mrow svg{display:block;margin-top:6px}
.dock{position:absolute;left:0;right:0;bottom:34px;height:64px;padding:10px var(--pad);background:var(--bg);border-top:1px solid var(--line)}
.phone.docked .scr{bottom:98px}
.mrow.open{background:var(--s1);margin:0 -10px;padding:6px 10px 0;width:calc(100% + 20px);border-radius:var(--r-card) var(--r-card) 0 0}
.banner{background:var(--s1);border-radius:var(--r-card);padding:10px 12px;margin:8px 0 4px;font-size:var(--fs-s);color:var(--sec);line-height:18px}
.banner b{color:var(--text);font-weight:var(--w-semi);font-size:var(--fs-m)}
.ltable tr[data-act]{cursor:pointer}
.ltable td.go{width:14px;color:var(--muted);text-align:right}
.pager{display:flex;align-items:center;height:44px;margin:0 -12px}
.pager button.ar{width:44px;height:44px;text-align:center;font-size:var(--fs-l);color:var(--sec)}
.pager button.ar.off{color:var(--context);cursor:default}
.pager .pt{flex:1;text-align:center;font-weight:var(--w-semi)}
.pager .pt span{color:var(--muted);font-weight:var(--w-reg);font-size:var(--fs-s)}
.nav{display:flex;align-items:center;height:44px;margin-left:-8px;color:var(--accent)}
.nav button{height:44px;padding:0 8px;color:var(--accent);font-size:var(--fs-m)}
.hero{display:flex;align-items:center;gap:16px;height:80px}
.hero .big{font-size:var(--fs-hero);font-weight:var(--w-semi);line-height:1;letter-spacing:-.02em}
.hero .big em{font-style:normal;color:var(--muted);font-weight:var(--w-reg)}
.hero .side{font-size:var(--fs-m);color:var(--sec);line-height:20px}
.hero .side b{display:block;color:var(--text);font-weight:var(--w-semi)}
.lead{font-size:var(--fs-l);line-height:26px;margin:2px 0 10px}
.lead.sm{font-size:var(--fs-m);line-height:20px;color:var(--sec)}
.days{display:flex;margin:0 -2px 6px;height:76px}
.day{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:var(--fs-xs);color:var(--muted);height:76px;position:relative}
.day .c{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:var(--fs-m);font-weight:var(--w-semi)}
.day .c.done{background:var(--done);color:var(--on-accent)}
.day .c.plan{box-shadow:inset 0 0 0 2px var(--band2);color:var(--text)}
.day .c.miss{box-shadow:inset 0 0 0 2px var(--context);color:var(--muted)}
.day .c.rest i{width:4px;height:4px;border-radius:2px;background:var(--context)}
.day.today .dn{color:var(--accent);font-weight:var(--w-semi)}
.day.today::after{content:"";position:absolute;bottom:2px;width:20px;height:2px;background:var(--accent);border-radius:1px}
.sec{margin-top:18px}
.sh{display:flex;justify-content:space-between;align-items:baseline;height:28px}
.sh h2{font-size:var(--fs-m);font-weight:var(--w-semi)}
.sh button,.lnk{color:var(--accent);font-size:var(--fs-s);height:28px}
.note{font-size:var(--fs-s);color:var(--muted);line-height:18px}
.legend{display:flex;gap:14px;font-size:var(--fs-xs);color:var(--muted);margin-top:6px;align-items:center}
.legend i{display:inline-block;width:12px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
.legend i.tk{width:2px;height:12px;border-radius:0;vertical-align:-2px}
.brow{display:block;width:100%;height:44px;padding-top:4px}
.brow .l{display:flex;justify-content:space-between;align-items:baseline;height:20px}
.brow .v{font-variant-numeric:tabular-nums}
.brow .v span{color:var(--muted);font-size:var(--fs-s)}
.brow svg{display:block;margin-top:5px}
.brow.open{background:var(--s1);margin:0 -10px;padding:4px 10px 0;width:calc(100% + 20px);border-radius:var(--r-card) var(--r-card) 0 0}
.contrib{background:var(--s1);margin:0 -10px 6px;padding:2px 10px 10px;border-radius:0 0 var(--r-card) var(--r-card);font-size:var(--fs-s);color:var(--sec);line-height:20px}
.contrib .num{color:var(--text)}
.card{background:var(--s1);border-radius:var(--r-card)}
.grp{display:block;width:100%;padding:10px 0;border-top:1px solid var(--line);min-height:56px}
.grp .l{display:flex;justify-content:space-between;align-items:baseline}
.grp .l b{font-weight:var(--w-semi)}
.grp .l .g{display:inline-block;width:20px;color:var(--sec)}
.grp .n{font-size:var(--fs-l);font-variant-numeric:tabular-nums}
.grp .names{font-size:var(--fs-s);color:var(--sec);margin:2px 0 0 20px;line-height:18px}
.lrow{display:flex;width:100%;align-items:center;justify-content:space-between;min-height:56px;border-top:1px solid var(--line);gap:10px;padding:6px 0}
.lrow .nm{font-weight:var(--w-semi)}
.lrow .sub{font-size:var(--fs-s);color:var(--sec);margin-top:1px}
.lrow .val{font-size:var(--fs-l);font-variant-numeric:tabular-nums;white-space:nowrap}
.lrow .val small{font-size:var(--fs-s);color:var(--muted)}
.lrow.mini{min-height:44px;padding-left:20px}
.lrow.mini .val{font-size:var(--fs-m)}
.nrow{display:block;width:100%;height:56px;border-top:1px solid var(--line);padding-top:8px}
.nrow .l{display:flex;justify-content:space-between;align-items:baseline}
.nrow .l .v{font-variant-numeric:tabular-nums;white-space:nowrap}
.nrow .tag{font-size:var(--fs-s);color:var(--sec);margin-left:6px;font-weight:var(--w-reg)}
.nrow svg{display:block;margin-top:7px}
.erow{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:56px;border-top:1px solid var(--line)}
.erow .sub{font-size:var(--fs-s);color:var(--sec)}
.erow .chev{color:var(--muted);font-size:var(--fs-l)}
.seg{display:flex;background:var(--s1);border-radius:var(--r-chip);padding:3px;height:44px;gap:2px}
.seg button{flex:1;text-align:center;border-radius:3px;font-size:var(--fs-s);color:var(--sec)}
.seg button.on{background:var(--s2);box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--accent);font-weight:var(--w-semi)}
.slot{height:104px;border-radius:var(--r-card);background:var(--s1);padding:12px 14px;margin:12px 0 6px;font-size:var(--fs-m);line-height:20px;color:var(--sec);position:relative}
.slot.ro{color:var(--text)}
.slot .d{font-weight:var(--w-semi)}
.slot .ws{font-variant-numeric:tabular-nums}
.slot .m{font-size:var(--fs-s);color:var(--muted);line-height:18px}
.slot .x{position:absolute;right:0;top:0;width:44px;height:44px;text-align:center;color:var(--muted);font-size:var(--fs-l)}
.slot .open{position:absolute;right:12px;bottom:8px;color:var(--accent);font-size:var(--fs-s);height:28px}
.verd{font-size:var(--fs-m);margin-top:4px}
.verd b{font-weight:var(--w-semi)}
.sub13{font-size:var(--fs-s);color:var(--muted)}
.rec{display:flex;justify-content:space-between;align-items:center;min-height:44px;border-top:1px solid var(--line);gap:8px}
.rec .k{font-size:var(--fs-s);color:var(--sec)}
.rec .val{font-variant-numeric:tabular-nums;text-align:right}
.rec .val small{display:block;font-size:var(--fs-s);color:var(--muted)}
.dh{display:flex;justify-content:space-between;font-size:var(--fs-s);color:var(--muted);margin-top:14px;height:22px;align-items:flex-end}
.dh b{color:var(--sec);font-weight:var(--w-semi)}
.srow{display:flex;justify-content:space-between;align-items:center;min-height:44px;border-top:1px solid var(--line);width:100%;gap:8px}
.srow .ws{font-variant-numeric:tabular-nums;font-size:var(--fs-s);color:var(--sec)}
.srow .r{font-size:var(--fs-s);color:var(--muted);text-align:right;white-space:nowrap}
.prim{display:block;width:100%;height:56px;border-radius:var(--r-card);background:var(--accent);color:var(--on-accent);font-weight:var(--w-semi);text-align:center;font-size:var(--fs-m)}
.plan{border-top:1px solid var(--line)}
.plan div{display:flex;justify-content:space-between;height:44px;align-items:center;border-bottom:1px solid var(--line)}
.plan div span:last-child{color:var(--sec)}
.block-h{display:grid;grid-template-columns:62px minmax(0,1fr) 72px 44px;font-size:var(--fs-xs);color:var(--muted);height:24px;align-items:end;padding-bottom:4px}
.bw{display:grid;grid-template-columns:62px minmax(0,1fr) 72px 44px;align-items:center;height:48px;border-top:1px solid var(--line);width:100%}
.bw .wl{font-size:var(--fs-s);line-height:16px}
.bw .wl b{display:block;font-weight:var(--w-semi);font-size:var(--fs-m)}
.bw .wl span{color:var(--muted)}
.bw .dots{display:flex;gap:0}
.bw .dots i{width:18px;height:18px;display:flex;align-items:center;justify-content:center;margin-right:2px;border-radius:50%;font-style:normal;font-size:10px}
.bw .dots i.done{background:var(--done)}
.bw .dots i.dl{background:var(--band1)}
.bw .dots i.miss{box-shadow:inset 0 0 0 2px var(--context)}
.bw .dots i.plan{box-shadow:inset 0 0 0 2px var(--band2)}
.bw .dots i.rest::after{content:"";width:3px;height:3px;border-radius:2px;background:var(--line)}

.bw .s{text-align:right;font-variant-numeric:tabular-nums}
.bw.cur{background:var(--s1)}
.err{position:fixed;left:0;top:0;background:#900;color:#fff;padding:8px;z-index:99;font-size:14px;white-space:pre}
.ltable{width:100%;border-collapse:collapse;font-size:var(--fs-s)}
.ltable td{padding:6px 0;border-top:1px solid var(--line);vertical-align:top}
.ltable td.nm{font-weight:var(--w-semi);font-size:var(--fs-s);width:112px;padding-right:10px;color:var(--text)}
.ltable td.ws{color:var(--sec);font-variant-numeric:tabular-nums}
.ltable td.lv{text-align:right;color:var(--text);width:128px;padding-left:8px}
.ltable td.lv small{display:block;color:var(--muted);font-size:var(--fs-xs)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;column-gap:20px}
.mgrid .brow{height:38px;padding-top:2px}.mgrid .brow .l{height:16px}.mgrid .brow svg{margin-top:3px}
@media (prefers-reduced-motion:no-preference){.phone.live .anim{transition:opacity .2s ease-out}}
</style>

         :`<circle cx="${cx}" cy="${cy}" r="${sel?6:4.5}" style="fill:var(--${sel?"accent":"done"});stroke:var(--${pd(p[0]).wk===13?"s2":"s1"})" stroke-width="2"/>`;

  LV.forEach(([id,lv,rc])=>{const p=LIFTS[id].p.find(x=>x[0]==="Wed 14 Oct");h+=`<button class="srow" style="display:block;padding:7px 0" data-act="lift:${id}"><div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-weight:600;font-size:var(--fs-s)">${SHORT[id]||LIFTS[id].n}</span><span style="font-size:var(--fs-s)">${lv}${rc?` <span style="color:var(--muted)">· ${rc}</span>`:""} <span style="color:var(--muted)">›</span></span></div><div class="ws" style="margin-top:2px">${sets(p[2])}</div></button>`});
  h+=`<div style="display:flex;gap:14px;align-items:center;margin-top:12px"><div style="flex:0 0 auto">${bodyMap(WED14,{h:120})}</div><div><p class="note">Worked today: Shoulders 10.5, Triceps 8, Chest 7, Quads 7, Hamstrings, Glutes and Calves 3.5, Lower back 2.</p>${mapLegend()}</div></div>`;
  h+=`<p class="note" style="margin-top:10px">Volume 4,185 kg (+ 44 bodyweight reps) · down 10 % on Fri 9 Oct, from heavier weights at fewer reps.</p>`;
  h+=`<p style="margin-top:10px">Next: Workout B, Fri 16 Oct. Seated biceps curls is ready: try 15 kg.</p></div>`;
  return h;
}
function segBar(segs,max,plan,w){w=w||350;const sx=v=>v/max*w;let x=0,s=`<svg width="${w}" height="14" style="display:block;margin-top:5px"><rect x="0" y="3" width="${w}" height="8" rx="2" ${S("s2")}/>`;
  segs.forEach(([v,c],i)=>{if(v<=0)return;const ww=sx(v)-(i?2:0);s+=`<rect x="${x+(i?2:0)}" y="3" width="${Math.max(0,ww)}" height="8" rx="2" ${S(c)}/>`;x+=sx(v)});
  if(plan!=null)s+=`<rect x="${Math.min(w-2,sx(plan)-1)}" y="0" width="2" height="14" ${S("text")}/>`;return s+"</svg>"}

/* ---------- app shell ---------- */
let DOCK="";
function render(st){
  let body,tabs=true;DOCK="";
  if(st.page==="lift"){body=liftPage(st);tabs=false}
  else if(st.page==="muscles"){body=musclesPage(st);tabs=false}
  else if(st.page==="records"){body=recordsPage(st);tabs=false}
  else if(st.page==="session"){body=st.ses==="Wed 14 Oct"&&st.data==="full"?summaryPage(st):sessionPage(st);tabs=false}
  else body=st.tab==="lifts"?liftsTab(st):st.tab==="program"?programTab(st):weekScreen(st);
  const tb=tabs?`<nav class="tabs">${[["week","Week"],["lifts","Lifts"],["program","Program"]].map(([k,t])=>`<button class="${st.tab===k?"on":""}" data-act="tab:${k}">${ico(k,st.tab===k)}${t}</button>`).join("")}</nav>`:"";
  return {html:`${statusBar()}<div class="scr">${body}</div>${DOCK}${tb}<div class="home"><i></i></div>`,tabs,dock:!!DOCK};
}
function base(o){return Object.assign({data:"full",tab:"week",page:null,week:16,block:false,cmp:false,lift:"back-squat",range:"3M",scrub:null,ses:null,grp:null,win:"2w",mOpen:null,recWeek:16,backLabel:"Week",hl:null,stack:[]},o||{})}
function mount(el,st){const r=render(st);el.className="phone"+(r.tabs?"":" notabs")+(r.dock?" docked":"")+(el.dataset.live?" live":"");el.innerHTML=r.html;return el}

/* ---------- interaction (frame P) ---------- */
let LIVE=null,LIVEEL=null;
function go(patch,push){if(push){LIVE.stack.push(JSON.stringify(Object.assign({},LIVE,{stack:[]})))}Object.assign(LIVE,patch);mount(LIVEEL,LIVE);const sc=LIVEEL.querySelector(".scr");if(patch._scroll!=null)sc.scrollTop=patch._scroll;else if(push||patch.page!==undefined||patch.tab)sc.scrollTop=0;}
function act(a){
  const [k,v]=a.split(/:(.*)/s);const st=LIVE;
  const pageName=st.page==="lift"?LIFTS[st.lift].n:st.page==="session"?st.ses:st.page==="records"?"Records":st.tab==="lifts"?"Lifts":"Week";
  switch(k){
    case "tab":LIVE.stack=[];go({tab:v,page:null,block:false,scrub:null});break;
    case "wk":{const w=st.week+ +v;if(st.data==="full"&&w>=0&&w<=16)go({week:w,grp:null,cmp:false});break}
    case "wkgo":go({week:+v,block:false,grp:null,cmp:false});break;
    case "block":go({block:!st.block,tab:"week",page:null,week:16});break;
    case "cmp":go({cmp:!st.cmp});break;
    case "grp":go({grp:st.grp===v?null:v,_scroll:LIVEEL.querySelector(".scr").scrollTop});break;
    case "lift":go({page:"lift",lift:v,scrub:null,backLabel:pageName,range:st.range||"3M"},true);break;
    case "range":go({range:v,scrub:null,_scroll:LIVEEL.querySelector(".scr").scrollTop});break;
    case "clear":go({scrub:null,_scroll:LIVEEL.querySelector(".scr").scrollTop});break;
    case "ses":go({page:"session",ses:v,backLabel:pageName,hl:st.page==="lift"?st.lift:null},true);break;
    case "muscles":go({page:"muscles",mOpen:null},true);break;
    case "win":go({win:v,mOpen:null});break;
    case "mrow":go({mOpen:st.mOpen===+v?null:+v,_scroll:LIVEEL.querySelector(".scr").scrollTop});break;
    case "mjump":{if(st.page!=="muscles")break;go({mOpen:+v});const el=LIVEEL.querySelector(`[data-k="m-${v}"]`);if(el)LIVEEL.querySelector(".scr").scrollTop=el.offsetTop-160;break}
    case "records":go({page:"records",recWeek:16},true);break;
    case "rw":{const w=st.recWeek+ +v;if(w>=13&&w<=16)go({recWeek:w});break}
    case "rwgo":go({recWeek:+v});break;
    case "back":{const prev=LIVE.stack.pop();if(prev){const s=JSON.parse(prev);s.stack=LIVE.stack;LIVE=s;mount(LIVEEL,LIVE)}else go({page:null});break}
    case "data":LIVE=base({data:v});mount(LIVEEL,LIVE);document.querySelectorAll(".dctl button").forEach(b=>b.classList.toggle("on",b.dataset.d===v));break;
  }
}
let DRAG=null;
function scrubAt(clientX){
  const svg=LIVEEL.querySelector("svg[data-strip]");if(!svg)return;const r=svg.getBoundingClientRect(),x=clientX-r.left;
  const xs=STRIPX[LIVE.lift];if(!xs||!xs.length)return;let best=xs[0];xs.forEach(p=>{if(Math.abs(p[0]-x)<Math.abs(best[0]-x))best=p});
  if(LIVE.scrub!==best[1]){const sc=LIVEEL.querySelector(".scr").scrollTop;LIVE.scrub=best[1];mount(LIVEEL,LIVE);LIVEEL.querySelector(".scr").scrollTop=sc}
}
function wire(el){
  el.addEventListener("click",e=>{const t=e.target.closest("[data-act]");if(t&&el.contains(t)){e.preventDefault();act(t.dataset.act)}});
  el.addEventListener("pointerdown",e=>{if(e.target.closest("[data-scrub]")){DRAG=true;scrubAt(e.clientX);e.preventDefault()}});
  document.addEventListener("pointermove",e=>{if(DRAG)scrubAt(e.clientX)});
  document.addEventListener("pointerup",()=>{DRAG=null});
}
