name = "workout-tracker"
main = "src/worker/index.ts"
compatibility_date = "2024-11-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "workout-tracker"
database_id = "85c69e30-8c54-40a6-9c88-d895707358d2"
migrations_dir = "migrations"

[vars]
# Empty means fail closed; the operator fills these in after enabling Access.
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
