name: Deploy to Cloudflare

# workflow_dispatch as well as push: the epic branch has to be deployable by hand so the
# on-device install checks can run before a pull request merges.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

# One deployment at a time, and never cancel one in flight: a half-published site is worse
# than a stale one.
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx wrangler d1 migrations apply workout-tracker --remote
      - run: npx wrangler deploy
